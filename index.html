<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Every Day — учи Python по 5 минут в день</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b1020;
    --card: #121a33;
    --accent: #4ade80;
    --accent2: #22d3ee;
    --text: #e6edf7;
    --muted: #93a3c4;
    --border: rgba(120,160,255,.18);
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 15% -10%, #1b2a5e 0%, transparent 60%),
                radial-gradient(1000px 500px at 90% 5%, #0f3b3a 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .blob {
    position: fixed; border-radius: 50%; filter: blur(90px);
    opacity: .30; z-index: 0; animation: float 14s ease-in-out infinite;
  }
  .blob.b1 { width: 360px; height: 360px; background: #4ade80; top: -100px; left: -100px; }
  .blob.b2 { width: 320px; height: 320px; background: #22d3ee; bottom: -80px; right: -80px; animation-delay: -5s; }
  .blob.b3 { width: 260px; height: 260px; background: #a78bfa; top: 45%; right: 20%; animation-delay: -9s; }
  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-30px) scale(1.08); }
  }

  .wrap { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; }

  header { text-align: center; padding: 40px 20px 30px; }
  .logo {
    width: 76px; height: 76px; margin: 0 auto 18px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-size: 38px;
    box-shadow: 0 12px 32px rgba(74,222,128,.35);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  h1 {
    font-size: 34px; letter-spacing: -.5px; margin-bottom: 12px;
    background: linear-gradient(90deg, #fff, #9ff0c1 60%, #7fe3f0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 16px; line-height: 1.6; max-width: 560px; margin: 0 auto 26px; }

  .btn-tg {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 30px; font-size: 16px; font-weight: 700; color: #06210f;
    text-decoration: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 12px 30px rgba(74,222,128,.35);
    transition: transform .18s, box-shadow .18s, filter .18s;
  }
  .btn-tg:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgba(34,211,238,.45); filter: brightness(1.06); }
  .btn-tg svg { width: 20px; height: 20px; }

  .lessons-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.8px;
    color: var(--muted); text-align: center; margin: 44px 0 20px; font-weight: 600;
  }

  .lessons { display: grid; gap: 14px; }

  .lesson {
    background: linear-gradient(160deg, rgba(18,26,51,.9), rgba(10,15,32,.9));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  .lesson:hover {
    border-color: rgba(74,222,128,.45);
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0,0,0,.4);
  }

  .lesson-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .lesson-num {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
    background: rgba(74,222,128,.15); color: var(--accent);
    border: 1px solid rgba(74,222,128,.3);
  }
  .lesson h3 { font-size: 17px; font-weight: 600; }

  .lesson-body { color: var(--muted); font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; }
  .lesson-body code {
    background: rgba(255,255,255,.07); padding: 2px 7px; border-radius: 5px;
    font-family: Consolas, monospace; color: var(--accent2); font-size: 13.5px;
  }

  .lesson-task {
    margin-top: 14px; padding: 14px 16px;
    background: rgba(34,211,238,.06);
    border-left: 3px solid var(--accent2);
    border-radius: 8px;
    font-size: 14px; line-height: 1.6;
  }
  .lesson-task .task-label {
    display: block; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--accent2); margin-bottom: 6px; font-weight: 700;
  }
  .lesson-task code {
    background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 5px;
    font-family: Consolas, monospace; color: var(--accent);
  }

  .hint-box {
    margin-top: 12px;
    border-radius: 10px;
    background: rgba(167,139,250,.07);
    border: 1px solid rgba(167,139,250,.25);
    overflow: hidden;
  }
  .hint-box summary {
    cursor: pointer;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #c4b5fd;
    list-style: none;
    user-select: none;
    transition: background .2s;
  }
  .hint-box summary::-webkit-details-marker { display: none; }
  .hint-box summary::before {
    content: "▸";
    display: inline-block;
    margin-right: 8px;
    transition: transform .2s;
  }
  .hint-box[open] summary::before { transform: rotate(90deg); }
  .hint-box summary:hover { background: rgba(167,139,250,.12); }
  .hint-content {
    padding: 4px 16px 16px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--muted);
    animation: fadeIn .25s ease;
  }
  .hint-content code {
    background: rgba(255,255,255,.08);
    padding: 2px 7px;
    border-radius: 5px;
    font-family: Consolas, monospace;
    color: #c4b5fd;
    font-size: 13px;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .loading {
    text-align: center; padding: 40px; color: var(--muted); font-size: 14px;
  }
  .error-box {
    text-align: center; padding: 30px; color: #fca5a5; font-size: 14px;
    background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25);
    border-radius: 12px;
  }

  footer {
    text-align: center; margin-top: 50px; padding: 26px 0;
    color: #5c6b8f; font-size: 13px;
    border-top: 1px solid rgba(120,160,255,.1);
  }

  @media (max-width: 480px) {
    h1 { font-size: 26px; }
    header { padding: 30px 12px 20px; }
    .lesson { padding: 16px 16px; }
  }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="wrap">

  <header>
    <div class="logo">🐍</div>
    <h1>Python Every Day</h1>
    <p class="subtitle">
      Учи Python по 5 минут в день. Уроки на сайте, проверка заданий — в Telegram-боте.
    </p>
    <a class="btn-tg" href="https://t.me/P_E_D_bot" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.04 15.47l-.38 5.36c.54 0 .78-.23 1.06-.5l2.55-2.44 5.29 3.87c.97.53 1.66.25 1.9-.9l3.44-16.1c.3-1.41-.5-1.96-1.44-1.61L.9 9.8c-1.37.53-1.35 1.29-.23 1.63l4.66 1.46L16.15 5.6c.5-.33.96-.15.58.18l-8.7 7.85z"/></svg>
      Открыть бота в Telegram
    </a>
  </header>

  <p class="lessons-title">📚 Уроки</p>

  <div class="lessons" id="lessons-container">
    <div class="loading">Загружаю уроки...</div>
  </div>

  <footer>
    Python Every Day · сделано с ❤️ для тех, кто учится программировать
  </footer>

</div>

<script>
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function formatText(text) {
    return esc(text).replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function renderLesson(lesson) {
    return `
      <div class="lesson">
        <div class="lesson-head">
          <div class="lesson-num">${lesson.id}</div>
          <h3>${esc(lesson.title)}</h3>
        </div>
        <div class="lesson-body">${formatText(lesson.body || '')}</div>
        <div class="lesson-task">
          <span class="task-label">Задание</span>
          ${formatText(lesson.task || '')}
        </div>
        <details class="hint-box">
          <summary>💡 Получить помощь</summary>
          <div class="hint-content">${formatText(lesson.hint || '')}</div>
        </details>
      </div>
    `;
  }

  fetch('lessons.json')
    .then(r => {
      if (!r.ok) throw new Error('Не удалось загрузить lessons.json (код ' + r.status + ')');
      return r.json();
    })
    .then(lessons => {
      const container = document.getElementById('lessons-container');
      if (!lessons.length) {
        container.innerHTML = '<div class="loading">Уроков пока нет.</div>';
        return;
      }
      container.innerHTML = lessons.map(renderLesson).join('');
    })
    .catch(err => {
      const container = document.getElementById('lessons-container');
      container.innerHTML = '<div class="error-box">⚠️ ' + esc(err.message) +
        '<br><br>Проверьте, что файл <code>lessons.json</code> лежит рядом с <code>index.html</code>.</div>';
    });
</script>

</body>
</html>
